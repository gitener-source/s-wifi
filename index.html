<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Surveillance WiFi</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0b0e13; --panel: #131822; --panel-2: #1a2130; --text: #eef1f6;
    --muted: #8b93a3; --accent: #ff4d4d; --accent-2: #2fd66a; --border: #232b3a;
    --btn: #232b3a; --btn-text: #eef1f6;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f3f6; --panel: #ffffff; --panel-2: #eceff4; --text: #12141a;
      --muted: #5b6272; --border: #dfe3ec; --btn: #e6e9f0; --btn-text: #12141a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e13; --panel: #131822; --panel-2: #1a2130; --text: #eef1f6;
    --muted: #8b93a3; --border: #232b3a; --btn: #232b3a; --btn-text: #eef1f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #app {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
  }
  .screen { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px 18px 4px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink:0; }
  .dot.live { background: var(--accent); animation: pulse 1.6s infinite; }
  .dot.ok { background: var(--accent-2); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,77,77,0.55); }
    70% { box-shadow: 0 0 0 10px rgba(255,77,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); }
  }
  h1 { font-size: 22px; margin: 0 0 6px 0; }
  p.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 24px 0; max-width: 380px; }
  .choice-grid { display: grid; gap: 14px; width: 100%; max-width: 420px; }
  .choice {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 18px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 16px; color: var(--text);
  }
  .choice:active { background: var(--panel-2); }
  .choice .emoji { font-size: 30px; line-height: 1; }
  .choice .label { font-weight: 700; font-size: 16.5px; margin-bottom: 3px; }
  .choice .desc { color: var(--muted); font-size: 13px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--btn); color: var(--btn-text); border: none; border-radius: 14px;
    padding: 15px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
    width: 100%; max-width: 380px;
  }
  .btn:active { opacity: 0.8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.success { background: var(--accent-2); color: #06210f; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.small { padding: 10px 16px; font-size: 14px; width: auto; }
  .btn[disabled] { opacity: 0.45; pointer-events: none; }
  .video-wrap {
    position: relative; border-radius: 18px; overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
    min-height: 30vh; border: 1px solid var(--border); flex-shrink: 0;
  }
  .camera-video { min-height: 55vh; min-height: 55dvh; }
  .viewer-video {
    width: 100%; aspect-ratio: 16 / 9; min-height: 0;
    max-height: calc(100vh - 120px); max-height: calc(100dvh - 120px);
  }
  .viewer-video video { object-fit: contain; }
  video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .overlay-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .pill {
    background: rgba(0,0,0,0.45); color: #fff; padding: 6px 11px; border-radius: 999px;
    font-size: 12.5px; display: flex; align-items: center; gap: 6px;
  }
  .switch-camera {
    background: rgba(0,0,0,0.58); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; min-width: 44px; min-height: 44px; padding: 8px 13px;
    font-size: 21px; cursor: pointer;
  }
  .switch-camera:active { transform: scale(0.96); }
  .remote-controls { display: flex; align-items: center; gap: 8px; }
  .landscape-button {
    background: rgba(0,0,0,0.58); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px; min-height: 44px; padding: 8px 13px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .landscape-button:active { transform: scale(0.96); }
  .blackout-overlay {
    display: none; position: fixed; inset: 0; z-index: 3000;
    background: #000; color: rgba(255,255,255,0.38);
    align-items: flex-end; justify-content: center; text-align: center;
    padding: 0 20px calc(28px + env(safe-area-inset-bottom, 0px));
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .blackout-overlay.active { display: flex; }
  .blackout-restore {
    border: 1px solid rgba(255,255,255,0.16); border-radius: 999px;
    padding: 10px 16px; font-size: 13px;
  }
  .view-area:fullscreen, .view-area:-webkit-full-screen { background: #000; padding: 0; }
  .view-area:fullscreen .viewer-video, .view-area:-webkit-full-screen .viewer-video {
    width: 100vw; height: 100vh; max-height: none; border: 0; border-radius: 0;
  }
  .view-area:fullscreen > .status-text, .view-area:fullscreen > .btn,
  .view-area:-webkit-full-screen > .status-text, .view-area:-webkit-full-screen > .btn { display: none; }
  .view-area.forced-landscape {
    position: fixed; inset: 0; z-index: 2500; width: 100vw; height: 100vh; height: 100dvh;
    background: #000; padding: 0; margin: 0; overflow: hidden;
  }
  .view-area.forced-landscape .viewer-video {
    width: 100%; height: 100%; max-height: none; aspect-ratio: auto;
    border: 0; border-radius: 0; flex: 1;
  }
  .view-area.forced-landscape > .status-text,
  .view-area.forced-landscape > .btn { display: none; }
  @media (orientation: portrait) {
    .view-area.forced-landscape {
      inset: auto; top: 50%; left: 50%;
      width: 100vh; width: 100dvh; height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-top: 14px; width: 100%; max-width: 460px;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 14.5px; }
  .card p.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px 0; }
  .qr-box {
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 12px; padding: 14px; margin: 12px auto; width: fit-content;
  }
  .qr-box img, .qr-box canvas, .qr-box table { display: block; }
  textarea.code-box {
    width: 100%; min-height: 60px; resize: vertical;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; word-break: break-all;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .status-text { color: var(--muted); font-size: 13.5px; margin-top: 12px; min-height: 18px; text-align: center; }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 9px 13px; font-size: 14px; cursor: pointer;
  }
  .placeholder-icon { font-size: 44px; opacity: 0.35; }
  .step-num {
    display: inline-flex; align-items:center; justify-content:center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 12px; font-weight: 700; margin-right: 8px; flex-shrink:0;
  }
  .step-title { display:flex; align-items:center; }
  details.manual { margin-top: 10px; }
  details.manual summary { color: var(--muted); font-size: 12.5px; cursor: pointer; }

  .password-box {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 15px 48px 15px 14px; font-size: 17px; outline: none;
  }
  .password-box:focus { border-color: var(--accent-2); }
  .password-wrap { position: relative; margin: 12px 0; }
  .show-password {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--muted); font-size: 20px;
    padding: 8px; cursor: pointer;
  }
  .security-note { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 10px; }
  .forget-button {
    margin-top: 10px; border: 0; background: transparent; color: var(--muted);
    font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 6px;
  }

</style>
</head>
<body>
<div id="app"></div>

<script>
(function() {
  "use strict";

  function el(tag, attrs, children) {
    var e = document.createElement(tag), k;
    attrs = attrs || {};
    for (k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c) {
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  var app = document.getElementById("app");
  var PASSWORD_STORAGE_KEY = "surveillance-wifi-password-v1";
  function render(node) { app.innerHTML = ""; app.appendChild(node); }

  function loadSavedPassword() {
    try { return localStorage.getItem(PASSWORD_STORAGE_KEY) || ""; }
    catch (e) { return ""; }
  }
  function savePassword(password) {
    try { localStorage.setItem(PASSWORD_STORAGE_KEY, password); }
    catch (e) {}
  }
  function forgetPassword(input, statusFn) {
    try { localStorage.removeItem(PASSWORD_STORAGE_KEY); } catch (e) {}
    if (input) input.value = "";
    if (statusFn) statusFn("Mot de passe oublié sur ce téléphone.");
  }

  function passwordField(className) {
    var input = el("input", { class: "password-box " + className, type: "password", placeholder: "Votre mot de passe", autocomplete: "off", autocapitalize: "none" });
    input.value = loadSavedPassword();
    var show = el("button", { class: "show-password", type: "button", "aria-label": "Afficher le mot de passe", onclick: function() {
      var visible = input.type === "text";
      input.type = visible ? "password" : "text";
      show.textContent = visible ? "👁" : "🙈";
    } }, ["👁"]);
    return el("div", { class: "password-wrap" }, [input, show]);
  }

  async function cameraId(password) {
    var data = new TextEncoder().encode("surveillance-wifi-v2:" + password);
    var digest = await crypto.subtle.digest("SHA-256", data);
    return "camera-" + Array.from(new Uint8Array(digest)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("").slice(0, 32);
  }

  function peerMessage(err) {
    if (!err) return "Connexion impossible.";
    if (err.type === "unavailable-id") return "Ce mot de passe est déjà utilisé par une autre caméra. Choisis-en un autre.";
    if (err.type === "peer-unavailable") return "Caméra introuvable. Vérifie le mot de passe et que la caméra est bien démarrée.";
    if (err.type === "network" || err.type === "server-error" || err.type === "socket-error") return "Service de connexion indisponible. Vérifie Internet puis réessaie.";
    return "Connexion impossible. Vérifie Internet et réessaie.";
  }

  function ScreenHome() {
    return el("div", { class: "screen center" }, [
      el("div", { style: "font-size:40px;" }, ["📡"]),
      el("h1", {}, ["Surveillance WiFi"]),
      el("p", { class: "sub" }, ["Vidéo en direct entre deux téléphones. Aucun QR code : saisis simplement le même mot de passe sur les deux appareils."]),
      el("div", { class: "choice-grid" }, [
        el("div", { class: "choice", onclick: function() { render(ScreenCamera()); } }, [
          el("div", { class: "emoji" }, ["📷"]),
          el("div", {}, [el("div", { class: "label" }, ["Caméra de surveillance"]), el("div", { class: "desc" }, ["Ce téléphone filme et diffuse l'image en direct."])])
        ]),
        el("div", { class: "choice", onclick: function() { render(ScreenViewer()); } }, [
          el("div", { class: "emoji" }, ["👁️"]),
          el("div", {}, [el("div", { class: "label" }, ["Écran de contrôle"]), el("div", { class: "desc" }, ["Ce téléphone affiche l'image en direct."])])
        ])
      ])
    ]);
  }

  function ScreenCamera() {
    var peer = null, stream = null, activeCall = null, facing = "environment", switching = false, wakeLock = null;
    var container = el("div", { class: "screen" });
    function status(t) { var n = container.querySelector(".status-text"); if (n) n.textContent = t; }
    function live(on) {
      var d = container.querySelector(".dot"), l = container.querySelector(".conn-label");
      if (d) d.className = "dot" + (on ? " live" : "");
      if (l) l.textContent = on ? "En direct" : (peer ? "Prête" : "Arrêtée");
    }
    function cleanup() {
      if (activeCall) try { activeCall.close(); } catch (e) {}
      if (peer) try { peer.destroy(); } catch (e) {}
      if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
      if (wakeLock) try { wakeLock.release(); } catch (e) {}
      wakeLock = null;
      activeCall = peer = stream = null;
    }
    async function keepAwake() {
      if (!navigator.wakeLock || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function() { wakeLock = null; });
      } catch (e) {}
    }
    async function hideLocalScreen() {
      if (!stream) { status("Démarre d'abord la caméra."); return; }
      var overlay = container.querySelector(".blackout-overlay");
      var preview = container.querySelector(".camera-video video");
      if (preview) {
        preview.pause();
        preview.srcObject = null;
      }
      if (overlay) overlay.classList.add("active");
      keepAwake();
      if (overlay && overlay.requestFullscreen) {
        try { await overlay.requestFullscreen(); } catch (e) {}
      } else if (overlay && overlay.webkitRequestFullscreen) {
        try { await overlay.webkitRequestFullscreen(); } catch (e) {}
      }
    }
    async function showLocalScreen() {
      var overlay = container.querySelector(".blackout-overlay");
      if (overlay) overlay.classList.remove("active");
      try {
        if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitFullscreenElement && document.webkitExitFullscreen) await document.webkitExitFullscreen();
      } catch (e) {}
      var preview = container.querySelector(".camera-video video");
      if (preview && stream) {
        preview.srcObject = stream;
        preview.play().catch(function() {});
      }
    }
    async function switchCamera() {
      if (!stream || switching) { status("Démarre d'abord la caméra."); return; }
      switching = true;
      var button = container.querySelector(".switch-camera");
      if (button) button.disabled = true;
      var nextFacing = facing === "environment" ? "user" : "environment";
      var oldTrack = stream.getVideoTracks()[0];
      var sender = null;
      if (activeCall && activeCall.peerConnection) {
        sender = activeCall.peerConnection.getSenders().find(function(s) { return s.track && s.track.kind === "video"; });
      }
      status(nextFacing === "environment" ? "Passage à la caméra arrière…" : "Passage à la caméra avant…");
      try {
        if (oldTrack) { stream.removeTrack(oldTrack); oldTrack.stop(); }
        var newVideoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: nextFacing }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        var newTrack = newVideoStream.getVideoTracks()[0];
        if (!newTrack) throw new Error("no-video-track");
        if (sender) await sender.replaceTrack(newTrack);
        stream.addTrack(newTrack);
        if (!container.querySelector(".blackout-overlay.active")) container.querySelector("video").srcObject = stream;
        facing = nextFacing;
        status(facing === "environment" ? "Caméra arrière activée." : "Caméra avant activée.");
      } catch (e) {
        try {
          var restored = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing } }, audio: false });
          var restoredTrack = restored.getVideoTracks()[0];
          if (sender && restoredTrack) await sender.replaceTrack(restoredTrack);
          if (restoredTrack) stream.addTrack(restoredTrack);
          if (!container.querySelector(".blackout-overlay.active")) container.querySelector("video").srcObject = stream;
        } catch (restoreError) {}
        status("Impossible de changer de caméra sur cet appareil.");
      }
      switching = false;
      if (button) button.disabled = false;
    }
    async function start() {
      var password = container.querySelector(".camera-password").value;
      if (password.length < 8) { status("Choisis un mot de passe d'au moins 8 caractères."); return; }
      savePassword(password);
      if (typeof Peer === "undefined") { status("Le service de connexion n'a pas pu charger. Vérifie Internet."); return; }
      cleanup();
      status("Ouverture de la caméra…");
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: true });
        container.querySelector("video").srcObject = stream;
        keepAwake();
      } catch (e) { status("Accès caméra refusé. Autorise la caméra et le micro dans les réglages du navigateur."); return; }
      var id;
      try { id = await cameraId(password); }
      catch (e) { status("Ce navigateur ne permet pas de sécuriser le mot de passe."); cleanup(); return; }
      status("Connexion au service…");
      peer = new Peer(id);
      peer.on("open", function() { live(false); status("Caméra prête. Entre le même mot de passe sur l'écran de contrôle."); container.querySelector(".start-btn").textContent = "Redémarrer la caméra"; });
      peer.on("connection", function(conn) {
        conn.on("open", function() {
          conn.on("data", function(data) {
            if (data === "switch-camera") { switchCamera(); return; }
            if (data !== "watch" || !stream) return;
            if (activeCall) try { activeCall.close(); } catch (e) {}
            activeCall = peer.call(conn.peer, stream);
            activeCall.on("close", function() { live(false); status("Écran de contrôle déconnecté. La caméra reste prête."); });
            activeCall.on("error", function() { live(false); status("La liaison vidéo a été interrompue."); });
            live(true); status("Image envoyée à l'écran de contrôle.");
          });
        });
      });
      peer.on("error", function(err) { live(false); status(peerMessage(err)); });
      peer.on("disconnected", function() { live(false); status("Connexion interrompue. Vérifie Internet."); });
    }

    container.appendChild(el("div", { class: "toolbar" }, [
      el("button", { class: "iconbtn", onclick: function() { cleanup(); render(ScreenHome()); } }, ["← Retour"]),
      el("div", { class: "pill" }, [el("span", { class: "dot" }), el("span", { class: "conn-label" }, ["Arrêtée"])])
    ]));
    container.appendChild(el("div", { class: "video-wrap camera-video" }, [
      el("video", { autoplay: "", playsinline: "", muted: "true" }),
      el("div", { class: "overlay-top" }, [
        el("span", { class: "pill" }, ["📷 Mode caméra"]),
        el("div", { class: "remote-controls" }, [
          el("button", { class: "landscape-button", type: "button", onclick: hideLocalScreen }, ["⬛ Écran noir"]),
          el("button", { class: "switch-camera", type: "button", title: "Changer de caméra", "aria-label": "Passer de la caméra arrière à la caméra avant", onclick: switchCamera }, ["🔄"])
        ])
      ])
    ]));
    container.appendChild(el("div", { class: "card" }, [
      el("h3", {}, ["Mot de passe de la caméra"]),
      el("p", { class: "hint" }, ["Choisis un mot de passe puis utilise exactement le même sur l'autre téléphone."]),
      passwordField("camera-password"),
      el("button", { class: "btn primary start-btn", onclick: start }, ["Démarrer la caméra"]),
      el("div", { class: "security-note" }, ["Le mot de passe sera mémorisé sur ce téléphone après le démarrage."]),
      el("button", { class: "forget-button", type: "button", onclick: function() { forgetPassword(container.querySelector(".camera-password"), status); } }, ["Oublier le mot de passe"])
    ]));
    container.appendChild(el("div", { class: "status-text" }, [""]));
    container.appendChild(el("div", { class: "blackout-overlay", role: "button", tabindex: "0", onclick: showLocalScreen }, [
      el("div", { class: "blackout-restore" }, ["Toucher l'écran pour réafficher les commandes"])
    ]));
    return container;
  }

  function ScreenViewer() {
    var peer = null, conn = null, call = null;
    var container = el("div", { class: "screen" });
    function status(t) { container.querySelectorAll(".status-text").forEach(function(n) { n.textContent = t; }); }
    function live(on) {
      var d = container.querySelector(".dot"), l = container.querySelector(".conn-label"), ph = container.querySelector(".placeholder");
      if (d) d.className = "dot" + (on ? " ok" : "");
      if (l) l.textContent = on ? "En direct" : "Non connecté";
      if (ph) ph.style.display = on ? "none" : "flex";
    }
    function cleanup(showSetup) {
      if (call) try { call.close(); } catch (e) {}
      if (conn) try { conn.close(); } catch (e) {}
      if (peer) try { peer.destroy(); } catch (e) {}
      peer = conn = call = null; live(false);
      var v = container.querySelector("video"); if (v) v.srcObject = null;
      var area = container.querySelector(".view-area");
      if (area) area.classList.remove("forced-landscape");
      document.documentElement.style.overflow = "";
      if (showSetup) { container.querySelector(".setup").style.display = "flex"; container.querySelector(".view-area").style.display = "none"; }
    }
    function remoteSwitchCamera() {
      if (!conn || !conn.open) { status("La caméra n'est pas encore connectée."); return; }
      conn.send("switch-camera");
      status("Changement de caméra demandé…");
    }
    function openLandscape() {
      var area = container.querySelector(".view-area");
      var button = container.querySelector(".landscape-button");
      var active = area.classList.toggle("forced-landscape");
      document.documentElement.style.overflow = active ? "hidden" : "";
      if (button) button.textContent = active ? "✕ Quitter" : "⛶ Paysage";
      status(active ? "Mode paysage activé." : "Mode paysage quitté.");
    }
    async function connect() {
      var password = container.querySelector(".viewer-password").value;
      if (password.length < 8) { status("Le mot de passe doit contenir au moins 8 caractères."); return; }
      savePassword(password);
      if (typeof Peer === "undefined") { status("Le service de connexion n'a pas pu charger. Vérifie Internet."); return; }
      cleanup(false); status("Recherche de la caméra…");
      var id;
      try { id = await cameraId(password); }
      catch (e) { status("Ce navigateur ne permet pas de sécuriser le mot de passe."); return; }
      peer = new Peer();
      peer.on("open", function() {
        conn = peer.connect(id, { reliable: true });
        conn.on("open", function() { status("Caméra trouvée. Ouverture de l'image…"); conn.send("watch"); });
        conn.on("error", function(err) { status(peerMessage(err)); });
        conn.on("close", function() { live(false); status("Caméra déconnectée."); });
      });
      peer.on("call", function(incoming) {
        call = incoming; call.answer();
        call.on("stream", function(remoteStream) {
          var v = container.querySelector("video");
          v.srcObject = remoteStream; v.muted = false;
          container.querySelector(".setup").style.display = "none";
          container.querySelector(".view-area").style.display = "flex";
          v.play().catch(function() { status("Touche l'écran pour lancer la vidéo avec le son."); });
          live(true); status("Connecté à la caméra.");
        });
        call.on("close", function() { live(false); status("La caméra a arrêté la diffusion."); });
        call.on("error", function() { live(false); status("La liaison vidéo a été interrompue."); });
      });
      peer.on("error", function(err) { live(false); status(peerMessage(err)); });
    }

    container.appendChild(el("div", { class: "toolbar" }, [
      el("button", { class: "iconbtn", onclick: function() { cleanup(true); render(ScreenHome()); } }, ["← Retour"]),
      el("div", { class: "pill" }, [el("span", { class: "dot" }), el("span", { class: "conn-label" }, ["Non connecté"])])
    ]));
    container.appendChild(el("div", { class: "screen center setup" }, [
      el("div", { style: "font-size:40px;" }, ["👁️"]),
      el("h1", {}, ["Écran de contrôle"]),
      el("p", { class: "sub" }, ["Entre le mot de passe choisi sur le téléphone caméra."]),
      el("div", { class: "card", style: "margin-top:0;" }, [
        el("h3", {}, ["Mot de passe de la caméra"]), passwordField("viewer-password"),
        el("button", { class: "btn success", onclick: connect }, ["Voir la caméra"]),
        el("div", { class: "security-note" }, ["Le mot de passe sera mémorisé sur ce téléphone après la connexion."]),
        el("button", { class: "forget-button", type: "button", onclick: function() { forgetPassword(container.querySelector(".viewer-password"), status); } }, ["Oublier le mot de passe"])
      ]),
      el("div", { class: "status-text" }, [""])
    ]));
    var viewArea = el("div", { class: "screen view-area", style: "display:none;" }, [
      el("div", { class: "video-wrap viewer-video", style: "flex:1;" }, [
        el("video", { autoplay: "", playsinline: "" }),
        el("div", { class: "placeholder", style: "position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--muted);" }, [el("div", { class: "placeholder-icon" }, ["📡"]), el("div", {}, ["En attente de l'image…"])]),
        el("div", { class: "overlay-top" }, [
          el("span", { class: "pill" }, ["👁️ En direct"]),
          el("div", { class: "remote-controls" }, [
            el("button", { class: "landscape-button", type: "button", onclick: openLandscape }, ["⛶ Paysage"]),
            el("button", { class: "switch-camera", type: "button", title: "Changer la caméra à distance", "aria-label": "Changer la caméra à distance", onclick: remoteSwitchCamera }, ["🔄"])
          ])
        ])
      ]),
      el("div", { class: "status-text" }, [""]),
      el("button", { class: "btn ghost", style: "margin:10px auto 0;", onclick: function() { cleanup(true); status("Déconnecté."); } }, ["Se déconnecter"])
    ]);
    container.appendChild(viewArea);
    return container;
  }

  render(ScreenHome());
})();
</script>
</body>
</html>
