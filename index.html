<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Surveillance WiFi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root {
    --bg: #0b0e13; --panel: #131822; --panel-2: #1a2130; --text: #eef1f6;
    --muted: #8b93a3; --accent: #ff4d4d; --accent-2: #2fd66a; --border: #232b3a;
    --btn: #232b3a; --btn-text: #eef1f6;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f3f6; --panel: #ffffff; --panel-2: #eceff4; --text: #12141a;
      --muted: #5b6272; --border: #dfe3ec; --btn: #e6e9f0; --btn-text: #12141a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e13; --panel: #131822; --panel-2: #1a2130; --text: #eef1f6;
    --muted: #8b93a3; --border: #232b3a; --btn: #232b3a; --btn-text: #eef1f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #app {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
  }
  .screen { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .center { align-items: center; justify-content: center; text-align: center; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px 18px 4px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink:0; }
  .dot.live { background: var(--accent); animation: pulse 1.6s infinite; }
  .dot.ok { background: var(--accent-2); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,77,77,0.55); }
    70% { box-shadow: 0 0 0 10px rgba(255,77,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,77,0); }
  }
  h1 { font-size: 22px; margin: 0 0 6px 0; }
  p.sub { color: var(--muted); font-size: 14.5px; margin: 0 0 24px 0; max-width: 380px; }
  .choice-grid { display: grid; gap: 14px; width: 100%; max-width: 420px; }
  .choice {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px 18px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 16px; color: var(--text);
  }
  .choice:active { background: var(--panel-2); }
  .choice .emoji { font-size: 30px; line-height: 1; }
  .choice .label { font-weight: 700; font-size: 16.5px; margin-bottom: 3px; }
  .choice .desc { color: var(--muted); font-size: 13px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--btn); color: var(--btn-text); border: none; border-radius: 14px;
    padding: 15px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
    width: 100%; max-width: 380px;
  }
  .btn:active { opacity: 0.8; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.success { background: var(--accent-2); color: #06210f; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.small { padding: 10px 16px; font-size: 14px; width: auto; }
  .btn[disabled] { opacity: 0.45; pointer-events: none; }
  .video-wrap {
    position: relative; border-radius: 18px; overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
    min-height: 30vh; border: 1px solid var(--border); flex-shrink: 0;
  }
  video { width: 100%; height: 100%; object-fit: cover; background: #000; }
  .overlay-top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .pill {
    background: rgba(0,0,0,0.45); color: #fff; padding: 6px 11px; border-radius: 999px;
    font-size: 12.5px; display: flex; align-items: center; gap: 6px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; margin-top: 14px; width: 100%; max-width: 460px;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 14.5px; }
  .card p.hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 10px 0; }
  .qr-box {
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 12px; padding: 14px; margin: 12px auto; width: fit-content;
  }
  .qr-box img, .qr-box canvas, .qr-box table { display: block; }
  textarea.code-box {
    width: 100%; min-height: 60px; resize: vertical;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; word-break: break-all;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .status-text { color: var(--muted); font-size: 13.5px; margin-top: 12px; min-height: 18px; text-align: center; }
  .iconbtn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 9px 13px; font-size: 14px; cursor: pointer;
  }
  .placeholder-icon { font-size: 44px; opacity: 0.35; }
  .step-num {
    display: inline-flex; align-items:center; justify-content:center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 12px; font-weight: 700; margin-right: 8px; flex-shrink:0;
  }
  .step-title { display:flex; align-items:center; }
  details.manual { margin-top: 10px; }
  details.manual summary { color: var(--muted); font-size: 12.5px; cursor: pointer; }

  .scan-overlay {
    position: fixed; inset: 0; background: #000; z-index: 999;
    display: flex; flex-direction: column;
  }
  .scan-overlay video { flex: 1; object-fit: cover; }
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 62vw; height: 62vw; max-width: 320px; max-height: 320px;
    border: 3px solid #fff; border-radius: 18px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
  }
  .scan-topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 16px) 16px 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    color: #fff; z-index: 2;
  }
  .scan-hint {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 14px; z-index: 2; padding: 0 20px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function() {
  "use strict";

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c) {
      if (c == null) return;
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  var app = document.getElementById("app");
  function render(node) { app.innerHTML = ""; app.appendChild(node); }

  // No STUN servers on purpose: this app only pairs devices on the same
  // local WiFi network, so only host (local) ICE candidates are needed,
  // which keeps the QR code small.
  var ICE_SERVERS = [];

  function encodeDesc(desc) {
    var json = JSON.stringify({ type: desc.type, sdp: trimSdp(desc.sdp) });
    if (typeof pako === "undefined") {
      return btoa(unescape(encodeURIComponent(json)));
    }
    var bytes = new TextEncoder().encode(json);
    var compressed = pako.deflate(bytes);
    var binary = "";
    for (var i = 0; i < compressed.length; i++) binary += String.fromCharCode(compressed[i]);
    return "1" + btoa(binary); // "1" prefix marks compressed payloads
  }
  function decodeDesc(text) {
    text = text.trim();
    if (text.charAt(0) === "1" && typeof pako !== "undefined") {
      var binary = atob(text.slice(1));
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var json = new TextDecoder().decode(pako.inflate(bytes));
      return JSON.parse(json);
    }
    return JSON.parse(decodeURIComponent(escape(atob(text))));
  }

  // Drops codec/candidate lines we don't need, to keep the QR code small.
  // Keeps only IPv4 host candidates (same-WiFi pairing needs nothing else)
  // and lets limitCodecsFor() (applied before offer/answer creation) do
  // the heavy lifting on codec lists.
  function trimSdp(sdp) {
    var lines = sdp.split("\r\n");
    var isIPv6HostCandidate = function(l) {
      if (l.indexOf("a=candidate") !== 0 || l.indexOf("typ host") === -1) return false;
      var parts = l.split(" ");
      var address = parts[4] || "";
      return address.indexOf(":") !== -1; // IPv6 addresses contain colons, IPv4 ones don't
    };
    var hasIPv4Host = lines.some(function(l) {
      return l.indexOf("a=candidate") === 0 && l.indexOf(" host ") !== -1 && !isIPv6HostCandidate(l);
    });
    if (!hasIPv4Host) return sdp; // keep everything if no IPv4 host candidate is available
    return lines.filter(function(l) { return !isIPv6HostCandidate(l); }).join("\r\n");
  }

  function limitCodecsFor(transceiver, kind) {
    try {
      var caps = RTCRtpSender.getCapabilities(kind);
      if (!caps || !caps.codecs || !caps.codecs.length) return;
      var preferred = caps.codecs.filter(function(c) {
        return kind === "video" ? /VP8|H264/i.test(c.mimeType) : /opus/i.test(c.mimeType);
      });
      if (preferred.length) transceiver.setCodecPreferences(preferred);
    } catch (e) { /* not supported: safe to ignore, just a bigger QR code */ }
  }

  function waitIceComplete(pc, timeoutMs) {
    return new Promise(function(resolve) {
      if (pc.iceGatheringState === "complete") return resolve();
      var done = false;
      function check() {
        if (pc.iceGatheringState === "complete" && !done) {
          done = true;
          pc.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      }
      pc.addEventListener("icegatheringstatechange", check);
      setTimeout(function() {
        if (!done) { done = true; pc.removeEventListener("icegatheringstatechange", check); resolve(); }
      }, timeoutMs || 3000);
    });
  }

  function renderQR(container, text) {
    container.innerHTML = "";
    if (typeof QRCode === "undefined") {
      container.textContent = "Bibliothèque QR indisponible (vérifie ta connexion internet).";
      return;
    }
    var tn = 4, ok = false;
    while (!ok && tn <= 40) {
      try {
        new QRCode(container, { text: text, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L, typeNumber: tn });
        ok = true;
      } catch (e) {
        container.innerHTML = "";
        tn++;
      }
    }
    if (!ok) container.textContent = "Code trop long pour tenir dans un QR code.";
  }

  async function copyText(text, statusFn) {
    try {
      await navigator.clipboard.writeText(text);
      statusFn && statusFn("Code copié dans le presse-papiers.");
    } catch (e) {
      statusFn && statusFn("Sélectionne le texte et copie-le manuellement.");
    }
  }

  // Opens a fullscreen camera scanner. Resolves with decoded text, or
  // rejects if the user cancels or the camera can't be opened.
  function scanQRCode(hintText) {
    return new Promise(function(resolve, reject) {
      var video = el("video", { autoplay: "", playsinline: "", muted: "true" });
      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d", { willReadFrequently: true });
      var raf = null, stream = null, done = false;

      var overlay = el("div", { class: "scan-overlay" }, [
        video,
        el("div", { class: "scan-frame" }),
        el("div", { class: "scan-topbar" }, [
          el("span", {}, ["Scanner le QR code"]),
          el("button", { class: "iconbtn", onclick: function() { finish(null); } }, ["Annuler"])
        ]),
        el("div", { class: "scan-hint" }, [hintText || "Cadre le QR code affiché sur l'autre téléphone."])
      ]);
      document.body.appendChild(overlay);

      function finish(result) {
        if (done) return;
        done = true;
        if (raf) cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
        overlay.remove();
        if (result) resolve(result); else reject(new Error("cancelled"));
      }

      function tick() {
        if (done) return;
        if (video.readyState >= 2 && typeof jsQR === "function") {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) { finish(code.data); return; }
          } catch (e) {}
        }
        raf = requestAnimationFrame(tick);
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
        .then(function(s) {
          if (done) { s.getTracks().forEach(function(t){t.stop();}); return; }
          stream = s;
          video.srcObject = s;
          video.play().catch(function(){});
          tick();
        })
        .catch(function(e) { finish(null); reject(e); });
    });
  }

  // ================= ACCUEIL =================
  function ScreenHome() {
    return el("div", { class: "screen center" }, [
      el("div", { style: "font-size:40px;" }, ["📡"]),
      el("h1", {}, ["Surveillance WiFi"]),
      el("p", { class: "sub" }, ["Diffusion vidéo directe entre deux iPhone sur le même réseau WiFi, sans serveur ni enregistrement. Connexion par QR code, sans AirDrop."]),
      el("div", { class: "choice-grid" }, [
        el("div", { class: "choice", onclick: function() { render(ScreenCamera()); } }, [
          el("div", { class: "emoji" }, ["📷"]),
          el("div", {}, [
            el("div", { class: "label" }, ["Caméra de surveillance"]),
            el("div", { class: "desc" }, ["Ce téléphone filme le lieu et diffuse l'image en direct."])
          ])
        ]),
        el("div", { class: "choice", onclick: function() { render(ScreenViewer()); } }, [
          el("div", { class: "emoji" }, ["👁️"]),
          el("div", {}, [
            el("div", { class: "label" }, ["Écran de contrôle"]),
            el("div", { class: "desc" }, ["Ce téléphone affiche l'image en direct."])
          ])
        ])
      ])
    ]);
  }

  // ================= CAMÉRA =================
  function ScreenCamera() {
    var pc = null, videoSender = null, audioSender = null, liveStream = null;
    var container = el("div", { class: "screen" });

    function setStatus(t) { var s = container.querySelector(".status-text"); if (s) s.textContent = t; }
    function setLive(v) {
      var dot = container.querySelector(".dot"); if (dot) dot.className = "dot" + (v ? " live" : "");
      var label = container.querySelector(".conn-label"); if (label) label.textContent = v ? "En direct" : "Non connecté";
    }

    function cleanup() {
      if (liveStream) liveStream.getTracks().forEach(function(t) { t.stop(); });
      if (pc) { try { pc.close(); } catch (e) {} }
    }

    async function createInvitation() {
      cleanup();
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      var videoTransceiver = pc.addTransceiver("video", { direction: "sendonly" });
      var audioTransceiver = pc.addTransceiver("audio", { direction: "sendonly" });
      limitCodecsFor(videoTransceiver, "video");
      limitCodecsFor(audioTransceiver, "audio");
      videoSender = videoTransceiver.sender;
      audioSender = audioTransceiver.sender;
      pc.onconnectionstatechange = function() {
        if (pc.connectionState === "connected") { setLive(true); setStatus("Connexion établie."); }
        if (["failed","disconnected","closed"].indexOf(pc.connectionState) !== -1) setLive(false);
      };
      setStatus("Génération du QR code d'invitation…");
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceComplete(pc, 3000);
      var code = encodeDesc(pc.localDescription);
      renderQR(container.querySelector(".offer-qr"), code);
      container.querySelector(".offer-text").value = code;
      container.querySelector(".step1-out").style.display = "block";
      container.querySelector(".step2").style.display = "block";
      setStatus("Fais scanner ce QR code par l'écran de contrôle.");
    }

    async function finalizeWithAnswer(answerText) {
      try {
        var desc = decodeDesc(answerText);
        await pc.setRemoteDescription(desc);
      } catch (e) {
        setStatus("Réponse invalide. Réessaie.");
        return;
      }
      setStatus("Ouverture de la caméra…");
      try {
        liveStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
      } catch (e) {
        setStatus("Impossible d'accéder à la caméra : vérifie les autorisations dans Réglages > Safari.");
        return;
      }
      var v = container.querySelector("video");
      if (v) v.srcObject = liveStream;
      var vt = liveStream.getVideoTracks()[0], at = liveStream.getAudioTracks()[0];
      if (vt && videoSender) await videoSender.replaceTrack(vt);
      if (at && audioSender) await audioSender.replaceTrack(at);
      setStatus("Connexion en cours…");
    }

    async function scanAnswer() {
      try {
        var text = await scanQRCode("Cadre le QR code affiché sur l'écran de contrôle.");
        await finalizeWithAnswer(text);
      } catch (e) { /* annulé */ }
    }

    container.appendChild(
      el("div", { class: "toolbar" }, [
        el("button", { class: "iconbtn", onclick: function() { cleanup(); render(ScreenHome()); } }, ["← Retour"]),
        el("div", { class: "pill" }, [ el("span", { class: "dot" }), el("span", { class: "conn-label" }, ["Non connecté"]) ])
      ])
    );

    container.appendChild(
      el("div", { class: "video-wrap" }, [
        el("video", { autoplay: "", playsinline: "", muted: "true" }),
        el("div", { class: "overlay-top" }, [ el("span", { class: "pill" }, ["📷 Mode caméra"]) ])
      ])
    );

    container.appendChild(
      el("div", { class: "card" }, [
        el("div", { class: "step-title" }, [ el("span", { class: "step-num" }, ["1"]), el("h3", {}, ["Créer une invitation"]) ]),
        el("p", { class: "hint" }, ["Génère un QR code que l'écran de contrôle va scanner."]),
        el("button", { class: "btn primary", onclick: createInvitation }, ["Créer une invitation"]),
        el("div", { class: "step1-out", style: "display:none;" }, [
          el("div", { class: "qr-box offer-qr" }),
          el("details", { class: "manual" }, [
            el("summary", {}, ["Le scan ne marche pas ? Copier le code à la place"]),
            el("textarea", { class: "code-box offer-text", readonly: "true" }),
            el("button", { class: "btn ghost small", style: "margin-top:8px;", onclick: function() { copyText(container.querySelector(".offer-text").value, setStatus); } }, ["Copier le code"])
          ])
        ])
      ])
    );

    container.appendChild(
      el("div", { class: "card step2", style: "display:none;" }, [
        el("div", { class: "step-title" }, [ el("span", { class: "step-num" }, ["2"]), el("h3", {}, ["Scanner la réponse"]) ]),
        el("p", { class: "hint" }, ["Une fois l'écran de contrôle connecté, il affichera son propre QR code : scanne-le pour finaliser."]),
        el("button", { class: "btn success", onclick: scanAnswer }, ["Scanner la réponse"]),
        el("details", { class: "manual" }, [
          el("summary", {}, ["Coller le code manuellement à la place"]),
          el("textarea", { class: "code-box answer-input", placeholder: "Colle la réponse ici…" }),
          el("button", { class: "btn ghost small", style: "margin-top:8px;", onclick: function() { finalizeWithAnswer(container.querySelector(".answer-input").value); } }, ["Connecter"])
        ])
      ])
    );

    container.appendChild(el("div", { class: "status-text" }, [""]));
    return container;
  }

  // ================= ÉCRAN DE CONTRÔLE =================
  function ScreenViewer() {
    var pc = null;
    var container = el("div", { class: "screen" });

    function setStatus(t) { var s = container.querySelector(".status-text"); if (s) s.textContent = t; }
    function setLive(v) {
      var dot = container.querySelector(".dot"); if (dot) dot.className = "dot" + (v ? " ok" : "");
      var label = container.querySelector(".conn-label"); if (label) label.textContent = v ? "En direct" : "Non connecté";
      var ph = container.querySelector(".placeholder"); if (ph) ph.style.display = v ? "none" : "flex";
    }

    async function handleOffer(offerText) {
      var offer;
      try { offer = decodeDesc(offerText); }
      catch (e) { setStatus("Code invalide."); return; }

      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      pc.ontrack = function(ev) {
        var v = container.querySelector("video");
        if (v) { v.srcObject = ev.streams[0]; v.muted = false; }
        setLive(true);
        setStatus("Connecté à la caméra.");
      };
      pc.onconnectionstatechange = function() {
        if (["failed","disconnected","closed"].indexOf(pc.connectionState) !== -1) { setLive(false); setStatus("Connexion perdue."); }
      };

      try {
        await pc.setRemoteDescription(offer);
        pc.getTransceivers().forEach(function(t) {
          var kind = (t.receiver && t.receiver.track && t.receiver.track.kind) || null;
          if (kind) limitCodecsFor(t, kind);
        });
        var answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await waitIceComplete(pc, 3000);
        var code = encodeDesc(pc.localDescription);
        renderQR(container.querySelector(".answer-qr"), code);
        container.querySelector(".answer-text").value = code;
        container.querySelector(".setup").style.display = "none";
        container.querySelector(".view-area").style.display = "flex";
        setStatus("Montre ce QR code à la caméra pour finaliser.");
      } catch (e) {
        setStatus("Erreur lors de la création de la réponse.");
      }
    }

    async function scanInvitation() {
      try {
        var text = await scanQRCode("Cadre le QR code affiché sur la caméra.");
        await handleOffer(text);
      } catch (e) { /* annulé */ }
    }

    function disconnect() {
      if (pc) { try { pc.close(); } catch (e) {} pc = null; }
      setLive(false);
      container.querySelector(".setup").style.display = "flex";
      container.querySelector(".view-area").style.display = "none";
      setStatus("Scanne le QR code affiché sur la caméra.");
    }

    container.appendChild(
      el("div", { class: "toolbar" }, [
        el("button", { class: "iconbtn", onclick: function() { disconnect(); render(ScreenHome()); } }, ["← Retour"]),
        el("div", { class: "pill" }, [ el("span", { class: "dot" }), el("span", { class: "conn-label" }, ["Non connecté"]) ])
      ])
    );

    container.appendChild(
      el("div", { class: "screen center setup" }, [
        el("div", { style: "font-size:40px;" }, ["👁️"]),
        el("h1", {}, ["Écran de contrôle"]),
        el("p", { class: "sub" }, ["Scanne le QR code affiché sur l'appareil qui fait office de caméra."]),
        el("button", { class: "btn success", onclick: scanInvitation }, ["Scanner l'invitation"]),
        el("details", { class: "manual" }, [
          el("summary", {}, ["Coller le code manuellement à la place"]),
          el("textarea", { class: "code-box offer-paste", placeholder: "Colle le code de la caméra ici…" }),
          el("button", { class: "btn ghost small", style: "margin-top:8px;", onclick: function() { handleOffer(container.querySelector(".offer-paste").value); } }, ["Se connecter"])
        ]),
        el("div", { class: "status-text" }, [""])
      ])
    );

    var viewArea = el("div", { class: "screen", style: "display:none;" }, [
      el("div", { class: "video-wrap" }, [
        el("video", { autoplay: "", playsinline: "" }),
        el("div", { class: "placeholder", style: "position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color: var(--muted);" }, [
          el("div", { class: "placeholder-icon" }, ["📡"]),
          el("div", {}, ["En attente de l'image de la caméra…"])
        ]),
        el("div", { class: "overlay-top" }, [ el("span", { class: "pill" }, ["👁️ En direct — non enregistré"]) ])
      ]),
      el("div", { class: "card" }, [
        el("h3", {}, ["Montre ce QR code à la caméra"]),
        el("div", { class: "qr-box answer-qr" }),
        el("details", { class: "manual" }, [
          el("summary", {}, ["Copier le code à la place"]),
          el("textarea", { class: "code-box answer-text", readonly: "true" }),
          el("button", { class: "btn ghost small", style: "margin-top:8px;", onclick: function() { copyText(container.querySelector(".answer-text").value, setStatus); } }, ["Copier le code"])
        ])
      ]),
      el("div", { class: "screen center", style: "flex:0; padding-top: 10px;" }, [
        el("button", { class: "btn ghost", onclick: disconnect }, ["Se déconnecter"])
      ])
    ]);
    viewArea.classList.add("view-area");
    container.appendChild(viewArea);

    return container;
  }

  render(ScreenHome());
})();
</script>
</body>
</html>
